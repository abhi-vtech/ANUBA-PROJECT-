[project]
name = "object-action-detection"
version = "0.1.0"
description = "Restaurant food preparation monitoring system"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.14.5,<=2.3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "lap>=0.5.12",
    "deep-sort-realtime>=1.3",
    "inference-sdk>=1.2.10",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    # KDS screen OCR.  RapidOCR ships PP-OCR models on onnxruntime: pure pip,
    # no system binary, CPU-fast, and installable on Jetson aarch64.
    "rapidocr-onnxruntime>=1.4.4",
    # Capped below 1.24: that release dropped cp310 wheels, and this project
    # supports Python 3.10, so an open pin makes `uv run` unresolvable.
    "onnxruntime>=1.19,<1.24",
]

[project.optional-dependencies]
# CoreML export (utils/export.py --format coreml) is an Apple-only deployment
# path. coremltools has no linux-aarch64 wheel, so it is NOT installed on the
# Jetson by default. Install on a Mac with: uv sync --extra export
export = [
    "coremltools>=9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
]

[tool.ruff.lint]
ignore = ["ANN"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
