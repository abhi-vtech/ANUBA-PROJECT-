[project]
name = "object-action-detection"
version = "0.1.0"
description = "Restaurant food preparation monitoring system"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.14.5,<=2.3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "lap>=0.5.12",
    "deep-sort-realtime>=1.3",
    # ultralytics routes a TensorRT export (scripts/export_tensorrt.py) through
    # ONNX first (export_engine calls export_onnx internally) and imports these
    # directly rather than declaring them as its own dependencies. The venv this
    # project uses has no `pip` module (uv-created), so ultralytics' own
    # pip-install-on-demand fallback for missing export deps can't run either --
    # declared here so `uv sync` provides them up front.
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.71",
    # Direct import in src/hotdog_tracker.py (scipy.optimize.linear_sum_assignment).
    # Previously satisfied only transitively via ultralytics — declared here so a
    # resolver change upstream cannot silently break the hotdog tracker.
    "scipy>=1.11",
    # Jetson/Orin note: torch is pulled from the Jetson AI Lab index's jp6
    # channel on linux-aarch64 (see [tool.uv.sources] below), not the generic
    # pytorch.org cu130 build and not that same index's sbsa/cu130 channel.
    # Neither of those has kernels for this GPU: pytorch.org's cu130 aarch64
    # wheel targets datacenter aarch64 parts and explicitly excludes Orin's
    # sm_87, and "sbsa" (server-base-system-architecture) is the same class of
    # datacenter-ARM target under a different name -- confirmed by actually
    # trying it: `torch.AcceleratorError: no kernel image is available for
    # execution on the device`, a harder failure than pytorch.org's JIT
    # fallback. "jp6" is JetPack 6, the generation this GPU family (Orin) is
    # actually built for, and its wheels carry real sm_87 cubins -- verified
    # by a CUDA matmul running with no "unsupported" warning at all. Pinned
    # exactly, not floored: torch and torchvision ship as a matched pair
    # (2.8.x <-> 0.23.x), and two independent floors can resolve to a
    # mismatched pair with no matching ABI.
    "torch==2.8.0",
    "torchvision==0.23.0",
    # The jp6 torch build above is a "slim" wheel: it loads its CUDA runtime
    # from separate nvidia-*-cu12 pip packages at import time (the same
    # mechanism official PyPI cu12x torch wheels use) but, unlike those,
    # doesn't declare any of them as a dependency -- so without these,
    # `import torch` fails immediately (libcudart.so.12 / libcublas.so.* not
    # found). Versions are left unpinned: torch's own loader matches by
    # filename pattern (libcublas.so.*[0-9]), not by an exact version string.
    "nvidia-cublas-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cudnn-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cuda-nvrtc-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cuda-runtime-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cuda-cupti-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cufft-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-curand-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-nvjitlink-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cusparse-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cusparselt-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cusolver-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-nccl-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-nvtx-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-cufile-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nvidia-nvshmem-cu12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    # KDS screen OCR.  RapidOCR ships PP-OCR models on onnxruntime: pure pip,
    # no system binary, CPU-fast, and installable on Jetson aarch64.
    "rapidocr-onnxruntime>=1.4.4",
    # Capped below 1.24: that release dropped cp310 wheels, and this project
    # supports Python 3.10, so an open pin makes `uv run` unresolvable.
    # Verified: 1.19.0-1.23.2 all publish manylinux aarch64 wheels for cp312.
    # On the Jetson itself this CPU build is replaced by onnxruntime-gpu below.
    "onnxruntime>=1.19,<1.24 ; sys_platform != 'linux' or platform_machine != 'aarch64' or python_version < '3.12'",
    # Jetson (JetPack 7, CUDA 13): the PyPI onnxruntime wheel is CPU-only, 652 ms
    # per inference for the segmentation model. NVIDIA's Jetson AI Lab build
    # exposes the CUDA and TensorRT execution providers (16.9 ms with TensorRT
    # FP16). It ships cp312 aarch64 wheels only, hence the Python marker.
    "onnxruntime-gpu==1.24.0 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version >= '3.12'",
]

[project.optional-dependencies]
# CoreML export (utils/export.py --format coreml) is an Apple-only deployment
# path. coremltools has no linux-aarch64 wheel, so it is NOT installed on the
# Jetson by default. Install on a Mac with: uv sync --extra export
export = [
    "coremltools>=9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
]

[tool.ruff.lint]
ignore = ["ANN"]

# Generic CUDA 13.0 aarch64 wheels (datacenter aarch64, e.g. GH200/GB200 --
# NOT Jetson).  Kept only as a resolvable index; nothing in [tool.uv.sources]
# below points at it any more.  It used to supply torch/torchvision, but that
# build has no kernels for this GPU's compute capability (Orin, sm_87).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# NVIDIA Jetson AI Lab's "sbsa" channel: also datacenter-ARM-targeted (SBSA =
# Server Base System Architecture), not Jetson, despite living under a
# "jetson-ai-lab.io" hostname -- its cu130 torch build has no sm_87 kernels
# either and hard-fails on this GPU (no pytorch.org-style JIT fallback even).
# Kept only for onnxruntime-gpu, which still resolves from here; nothing else
# points at it.
[[tool.uv.index]]
name = "jetson-ai-lab-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple"
explicit = true

# NVIDIA Jetson AI Lab's "jp6" (JetPack 6) channel -- the generation this
# board (Orin) actually ships as, with real sm_87 cubins.  torch and
# torchvision come from here.
[[tool.uv.index]]
name = "jetson-ai-lab-jp6"
url = "https://pypi.jetson-ai-lab.io/jp6/cu129/+simple"
explicit = true

# Marker-scoped so this stays cross-platform: only Linux aarch64 (Jetson) pulls
# from a Jetson index. macOS and linux-x86_64 keep resolving torch from PyPI,
# so the macOS/CoreML build path documented in README.md is unaffected.
[tool.uv.sources]
torch = [
    { index = "jetson-ai-lab-jp6", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "jetson-ai-lab-jp6", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
onnxruntime-gpu = [
    { index = "jetson-ai-lab-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.uv]
# rapidocr-onnxruntime also requires the CPU `onnxruntime`. On the Jetson that
# would install a second copy of the same `onnxruntime` module over the GPU
# build, so the requirement is limited to the platforms that use the CPU build.
override-dependencies = [
    "onnxruntime>=1.19,<1.24 ; sys_platform != 'linux' or platform_machine != 'aarch64' or python_version < '3.12'",
]
