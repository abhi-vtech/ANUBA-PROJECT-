services:
  object-action-detection:
    image: oad-pipeline:nvidia
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oad-pipeline
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - model-cache:/root/.cache/ultralytics
      - ./videos:/app/videos
      - ./rf_trained:/app/rf_trained
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VIDEO_SOURCE=${VIDEO_SOURCE:-/app/videos/sample_video.mp4}
      - MODEL_PATH=${MODEL_PATH:-rf_trained/yolo26n.pt}
      - MODEL_TYPE=${MODEL_TYPE:-yolo}
      - TRACKER_TYPE=${TRACKER_TYPE:-botsort}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - PICK_DWELL_MS=${PICK_DWELL_MS:-200}
      - PLACE_DWELL_MS=${PLACE_DWELL_MS:-500}
      - FRAME_WIDTH=${FRAME_WIDTH:-1280}
      - FRAME_HEIGHT=${FRAME_HEIGHT:-720}
      - FPS=${FPS:-30}
      - KDS_MODE=${KDS_MODE:-mock}
      - OPTICAL_FLOW_ENABLED=${OPTICAL_FLOW_ENABLED:-true}
      - LOG_METRICS_INTERVAL=${LOG_METRICS_INTERVAL:-5}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  model-cache: