# ---------------------------------------------------------------------------
# KDS shortcut -> physical hotdog item mapping.
#
# This file is the ONLY place supported hotdog shortcuts are defined.  The
# tracking / validation logic in src/kds/ reads it and never hard-codes a
# shortcut, so adding a menu item is a config change, not a code change.
#
# RULE 4 (Supported shortcuts): only the shortcuts listed here are recognised.
# Anything else inside a yellow bar is reported as UNKNOWN_SHORTCUT and is
# never silently mapped onto an existing item.
#
# Shortcut text is matched case-insensitively after normalisation
# (whitespace collapsed, '/' and '-' kept, punctuation stripped).  `aliases`
# exist for OCR spelling drift -- the KDS itself prints "Chicgo", and OCR
# regularly returns "0rg" for "Org" or "CHl" for "CHL".
#
# `ingredients` are the canonical production-side ingredient names (they must
# match the bin names in config/zones.json / the YOLO sauce classes) and are
# used for INFERRED type matching only.  The detection model has no
# hotdog-type class, so a type verdict from these is always reported with a
# low-confidence flag -- see docs in src/kds/fifo_queue.py.
# ---------------------------------------------------------------------------

version: 1

# Canonical physical item name -> what the production video should show.
# Every hotdog item maps to the single YOLO class "hot-dog"; the distinction
# between them lives in `ingredients`.
detection_class: hot-dog

shortcuts:

  ORG_CHL:
    shortcut: "ORG CHL"
    item: "ORIGINAL_CHILI_DOG"
    display: "Original Chili Dog"
    ingredients: ["chilli", "onions"]
    aliases:
      - "ORG CHL"
      - "0RG CHL"
      - "ORG CHI"
      - "ORGCHL"
      - "ORG CHL DOG"
      - "ORIG CHL"

  ORG_CC:
    shortcut: "ORG C/C"
    item: "ORIGINAL_CHILI_CHEESE_DOG"
    display: "Original Chili Cheese Dog"
    ingredients: ["chilli", "yellow cheese (sliced)"]
    aliases:
      - "ORG C/C"
      - "ORG C C"
      - "0RG C/C"
      - "ORGC/C"
      - "ORG CC"

  ORG_MUST:
    shortcut: "ORG MUST"
    item: "ORIGINAL_MUSTARD_DOG"
    display: "Original Mustard Dog"
    ingredients: ["yellow_mustard_sauce", "onions"]
    aliases:
      - "ORG MUST"
      - "0RG MUST"
      - "ORG MUS"
      - "ORGMUST"

  ORG_CHICAGO:
    shortcut: "ORG CHICGO"
    item: "ORIGINAL_CHICAGO_DOG"
    display: "Original Chicago Dog"
    ingredients:
      - "yellow_mustard_sauce"
      - "pickle spears"
      - "tomato"
      - "relish"
      - "onions"
      - "sport (wax) peppers"
    aliases:
      - "ORG CHICGO"
      - "ORG CHICAGO"
      - "0RG CHICGO"
      - "ORG CHICG0"
      - "ORGCHICGO"

  # Seen on real tickets and previously logged as UNKNOWN SHORTCUT, which
  # failed the whole order.  All-beef counterpart of ORG_CHICAGO.
  AB_CHICAGO:
    shortcut: "AB CHICGO"
    item: "ALL_BEEF_CHICAGO_DOG"
    display: "All Beef Chicago Dog"
    ingredients:
      - "yellow_mustard_sauce"
      - "pickle spears"
      - "tomato"
      - "relish"
      - "onions"
      - "sport (wax) peppers"
    aliases:
      - "AB CHICGO"
      - "AB CHICAGO"
      - "AB CHICG0"
      - "ABCHICGO"

  # A plain dog: no condiments by default, so an empty ingredient list is
  # correct rather than missing.
  ORG_PLAIN:
    shortcut: "ORG PLAN"
    item: "ORIGINAL_PLAIN_DOG"
    display: "Original Plain Dog"
    ingredients: []
    aliases:
      - "ORG PLAN"
      - "ORG PLAIN"
      - "0RG PLAN"
      - "ORGPLAN"

  POLISH_SAND:
    shortcut: "POLISH SAND"
    item: "POLISH_SANDWICH"
    display: "Polish Sandwich"
    ingredients:
      - "onions"
    aliases:
      - "POLISH SAND"
      - "POLISH SANDWICH"
      - "POLSH SAND"
      - "POLISHSAND"

  AB_CC:
    shortcut: "AB C/C"
    item: "ALL_BEEF_CHILI_CHEESE_DOG"
    display: "All Beef Chili Cheese Dog"
    ingredients: ["chilli", "yellow cheese (sliced)"]
    aliases:
      - "AB C/C"
      - "AB C C"
      - "A8 C/C"
      - "ABC/C"
      - "AB CC"

  AB_MUST:
    shortcut: "AB MUST"
    item: "ALL_BEEF_MUSTARD_DOG"
    display: "All Beef Mustard Dog"
    ingredients: ["yellow_mustard_sauce", "onions"]
    aliases:
      - "AB MUST"
      - "A8 MUST"
      - "AB MUS"
      - "ABMUST"

  AB_CHL:
    shortcut: "AB CHL"
    item: "ALL_BEEF_CHILI_DOG"
    display: "All Beef Chili Dog"
    ingredients: ["chilli", "onions"]
    aliases:
      - "AB CHL"
      - "A8 CHL"
      - "AB CHI"
      - "ABCHL"

  AB_KRAUT:
    shortcut: "AB KRAUT"
    item: "ALL_BEEF_KRAUT_DOG"
    display: "All Beef Kraut Dog"
    ingredients: ["sauerkraut", "yellow_mustard_sauce"]
    aliases:
      - "AB KRAUT"
      - "A8 KRAUT"
      - "AB KRAVT"
      - "ABKRAUT"

  ORG_KRAUT:
    shortcut: "ORG KRAUT"
    item: "ORIGINAL_KRAUT_DOG"
    display: "Original Kraut Dog"
    ingredients: ["sauerkraut", "yellow_mustard_sauce"]
    aliases:
      - "ORG KRAUT"
      - "0RG KRAUT"
      - "ORGKRAUT"

# ---------------------------------------------------------------------------
# Add-on vocabulary.  Grey text under a yellow bar is looked up here.
# `ingredient` is the production-side name used IF add-on validation is ever
# enabled; today add-ons are stored and displayed but never marked detected
# without real production-video evidence (RULE: no false add-on completion).
# ---------------------------------------------------------------------------
addons:
  ONION:
    display: "Onion"
    ingredient: "onions"
    aliases: ["ONION", "ONIONS", "0NION", "ONlON"]
  MAYO:
    display: "Mayo"
    ingredient: null
    aliases: ["MAYO", "MAYONNAISE", "MAY0"]
  KETCHUP:
    display: "Ketchup"
    ingredient: "ketchup_sauce"
    aliases: ["KETCHUP", "KETCHUP SAUCE", "KETCHUP.", "KETCHUP"]
  MUSTARD:
    display: "Mustard"
    ingredient: "yellow_mustard_sauce"
    aliases: ["MUSTARD", "MUST", "YELLOW MUSTARD"]
  CHEESE:
    display: "Cheese"
    ingredient: "yellow cheese (sliced)"
    aliases: ["CHEESE", "CHZ"]
  RELISH:
    display: "Relish"
    ingredient: "relish"
    aliases: ["RELISH"]
  JALAPENO:
    display: "Jalapeno"
    ingredient: "jalapenos"
    aliases: ["JALAPENO", "JALAPENOS", "JLPNO", "JALP", "+ JALP", "-JALP"]
  TOMATO:
    display: "Tomato"
    ingredient: "tomato"
    aliases: ["TOMATO", "TOMATOES"]
  PICKLE:
    display: "Pickle"
    ingredient: "pickle spears"
    aliases: ["PICKLE", "PICKLES", "PICKEL"]
  RANCH:
    display: "Ranch"
    ingredient: null
    aliases: ["RANCH"]
  SAUERKRAUT:
    display: "Sauerkraut"
    ingredient: "sauerkraut"
    aliases: ["KRAUT", "SAUERKRAUT"]
  NO_MUSTARD:
    display: "No Mustard"
    ingredient: "yellow_mustard_sauce"
    negation: true
    aliases: ["NO MUST", "NO MUSTARD", "-MUST", "N/MUST"]
  NO_KETCHUP:
    display: "No Ketchup"
    ingredient: "ketchup_sauce"
    negation: true
    aliases: ["NO KETCHUP", "-KETCHUP"]
  NO_CHEESE:
    display: "No Cheese"
    ingredient: "yellow cheese (sliced)"
    negation: true
    aliases: ["NO CHEESE", "-CHEESE", "NO CHZ"]
  NO_ONION:
    display: "No Onion"
    ingredient: null
    negation: true
    aliases: ["NO ONION", "-ONION", "NO ONIONS", "N/ONION"]

# ---------------------------------------------------------------------------
# Known NON-hotdog menu lines.  These appear on plain or cyan backgrounds and
# are already excluded by the yellow-bar rule, but listing them lets the parser
# distinguish "a line we deliberately ignore" from "a line we failed to read",
# which keeps the UNKNOWN_SHORTCUT log signal clean.
# ---------------------------------------------------------------------------
non_hotdog_items:
  - "CRN DOG"
  - "CORN DOG"
  - "SML FRY"
  - "LRG FRY"
  - "MED FRY"
  - "SM COKE"
  - "LG COKE"
  - "MD COKE"
  - "SM DRINK"
  - "LG DRINK"
  - "CHILI FRY"
  - "CHZ FRY"
  - "TENDER 2PK"
  - "TENDER 3PK"
  - "DLX CH BRG"
  - "CH BRG"
  - "LRG CC FRY"
  - "SML CC FRY"
  - "MINI CRN 6"
  - "MINI CRN"
  - "JAL PPR 6"
  - "JAL PPR"
  - "MED FRY"
  - "CAN CHILI"
  - "PINT CHILI"
  - "QT CHILI"
  - "C/C FRY"
  - "CC FRY"
  - "CC FRY BUR"
  - "FUNL APL"
  - "FUNNEL APPLE"

# ---------------------------------------------------------------------------
# Matching behaviour
# ---------------------------------------------------------------------------
matching:
  # Minimum similarity (0..1, difflib ratio) for a fuzzy alias match.  Below
  # this the shortcut is UNKNOWN rather than force-fitted to a neighbour.
  fuzzy_threshold: 0.82
  # Fuzzy matching is only attempted when the exact/normalised lookup fails.
  enable_fuzzy: true
