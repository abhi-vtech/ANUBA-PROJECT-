# ---------------------------------------------------------------------------
# KDS screen visual semantics.
#
# Every colour decision the KDS reader makes is driven from this file.  Bands
# are HSV in OpenCV ranges: H 0-179, S 0-255, V 0-255.
#
#   YELLOW              -> hotdog shortcut bar          (RULE 2)
#   GREY                -> add-on belonging to the bar above it (RULE 3)
#   CYAN                -> drink line, ignored
#   PAID_GREEN          -> the total bar; text decides PAID vs NOT PAID
#   LIGHT_PINK          -> overdue card body (informational only)
#
# Colour is never used alone -- see src/kds/ticket_parser.py, which combines
# colour with the card bounding box, OCR text, relative row position, temporal
# persistence and ticket identity before making any decision.
#
# Tune the bands against real footage with:
#     python scripts/calibrate_kds_colors.py <kds video>
# ---------------------------------------------------------------------------

version: 1

colors:
  yellow:
    # Bright saturated yellow bar behind black shortcut text.
    hsv_lower: [20, 90, 120]
    hsv_upper: [38, 255, 255]
    # Fraction of the row's pixels that must fall in the band to classify.
    min_fraction: 0.35

  grey:
    # Desaturated mid-grey add-on bar.  Low saturation is the discriminator;
    # the value band excludes both the white card body and black text.
    hsv_lower: [0, 0, 95]
    hsv_upper: [179, 55, 205]
    min_fraction: 0.40

  orange:
    # Observed on the live KDS: an add-on bar rendered orange rather than grey
    # (e.g. "2 Onion" under "2 Org C/C").  It is an ADD-ON, not an item -- see
    # ADDON_ROLES in src/kds/ticket_parser.py.
    hsv_lower: [8, 120, 120]
    hsv_upper: [22, 255, 255]
    min_fraction: 0.35

  blue:
    # Non-hotdog product bar (e.g. "TENDER 2PK").  Ignored as an order item.
    hsv_lower: [100, 120, 90]
    hsv_upper: [130, 255, 255]
    min_fraction: 0.30

  magenta:
    # Non-hotdog product bar (e.g. "Dlx Ch Brg").  Ignored as an order item.
    # Deliberately far more saturated than the pale light_pink card body so a
    # magenta ITEM bar is never confused with an overdue CARD.
    hsv_lower: [140, 120, 100]
    hsv_upper: [170, 255, 255]
    min_fraction: 0.30

  cyan:
    hsv_lower: [80, 90, 120]
    hsv_upper: [100, 255, 255]
    min_fraction: 0.30

  paid_green:
    # Green text on a black bar -- low fraction because it is text, not fill.
    hsv_lower: [40, 90, 90]
    hsv_upper: [85, 255, 255]
    min_fraction: 0.04

  light_pink:
    # Pale pink CARD BODY.
    #
    # Verified against the live KDS capture: the card body colour is an AGE
    # escalation -- white (fresh) -> yellow (approaching target time) -> light
    # pink (overdue).  It says the order is running late, nothing more, so it
    # is NOT used to judge an order.  The band exists purely so that an overdue
    # card is still recognised as a card by the detector.
    #
    # The verdict comes from the ticket DISAPPEARING from the screen; see
    # TicketManager.on_ticket_disappeared.
    #
    # Low-to-mid saturation with hue at either end of the wheel, so two bands
    # are checked and unioned.
    hsv_lower: [160, 25, 140]
    hsv_upper: [179, 170, 255]
    hsv_lower_2: [0, 25, 140]
    hsv_upper_2: [12, 170, 255]
    # Fraction of the WHOLE ticket card that must be pink to count as "on".
    min_fraction: 0.30

  card_body:
    # Pale card background (near-white / pale green-white) used by the ticket
    # detector to find cards against the dark KDS desktop.
    hsv_lower: [0, 0, 150]
    hsv_upper: [179, 80, 255]

# ---------------------------------------------------------------------------
# Ticket card detection
# ---------------------------------------------------------------------------
card_detection:
  # A card must occupy at least this fraction of the frame area, and at most
  # this much, to be considered a ticket.  Tuned for a phone-recorded 1080p
  # KDS screen showing 1-6 cards.
  min_area_fraction: 0.008
  max_area_fraction: 0.60
  # Cards are portrait-ish rectangles.  height/width bounds.
  min_aspect_ratio: 0.55
  max_aspect_ratio: 4.00
  # Morphological close kernel (px) used to fuse text rows into a solid card.
  close_kernel: 15
  # Cards must be at least this many px wide/tall.
  min_width_px: 90
  min_height_px: 110
  # The KDS lays cards out in a grid with only a 1-2px border between them, so
  # a colour mask fuses neighbours into one blob.  Wide blobs are split on
  # vertical dark gutters; a blob wider than this multiple of the median card
  # width is always split.
  split_merged_columns: true
  expected_card_width_px: 245
  max_card_width_px: 420
  # Value below which a pixel column counts as a gutter between two cards.
  gutter_v_max: 90
  # Rows below this fraction of the frame height are the KDS status bar.
  ignore_bottom_fraction: 0.045
  # Two boxes overlapping by more than this IoU are the same card slot.
  slot_iou_threshold: 0.45
  # A card whose whole body has turned pink or yellow is no longer "pale", so
  # the detector accepts those bands too.  All three are just age states of the
  # same card.
  accept_pink_cards: true
  # A card body this yellow (or pink) is fully highlighted, which makes the
  # yellow-bar rule non-discriminating; the parser falls back to resolving
  # items by content.  See TicketParser._extract_items.
  whole_card_yellow_threshold: 0.45
  # Reject ragged blobs: a ticket card is a filled rectangle.
  min_rectangularity: 0.70
  # Value below which a pixel is the dark KDS desktop.
  screen_v_max: 110
  min_screen_fraction: 0.08

# ---------------------------------------------------------------------------
# Row segmentation inside a card
# ---------------------------------------------------------------------------
rows:
  # OCR boxes whose vertical centres are within this fraction of the card
  # height are merged into a single logical row (handles a shortcut that wraps
  # onto two lines, e.g. "2 Org / Chicgo").
  merge_tolerance_frac: 0.020
  # A grey add-on row is normally indented relative to its parent yellow bar.
  # Indentation is a supporting signal only, never a requirement.
  indent_hint_frac: 0.04
  # Fraction of a row's height, measured from its own box, sampled for the
  # background colour vote (avoids clipping into neighbouring rows).
  color_sample_inset_frac: 0.15

# ---------------------------------------------------------------------------
# OCR
# ---------------------------------------------------------------------------
ocr:
  engine: rapidocr           # rapidocr | stub
  min_confidence: 0.35
  # Upscale small card crops before OCR; screen text photographed off a
  # monitor is often < 20px tall which most detectors handle poorly.
  upscale_to_height: 900
  # Run OCR on every Nth KDS frame.  Temporal aggregation (below) makes a
  # low rate safe and keeps CPU cost down.
  #
  # Measured on the 1280x1024 capture: ~0.6s per OCR pass per ticket card, so a
  # 3-card screen costs ~1.8s.  At the KDS's ~10fps that means OCR can run at
  # most every ~20th frame in real time; 10 leaves headroom on a machine that
  # is not also running YOLO.  Raise it if the KDS reader falls behind.
  #
  # NOTE: the stability confirmation counts below are counted in OCR passes,
  # not frames, so stride x paid_confirm_observations is the real latency
  # before a paid ticket is created (10 x 3 = 30 frames = ~3s at 10fps).
  # Card PRESENCE is checked on every frame regardless of this value, because
  # presence is what decides when an order ends.
  frame_stride: 10

# ---------------------------------------------------------------------------
# Temporal stability (RULE: OCR is never a per-frame independent decision)
# ---------------------------------------------------------------------------
stability:
  # Whether a ticket must read PAID before it enters the system.  false means
  # the ticket enters as soon as its content settles, which is what the kitchen
  # actually works to -- the order is on the screen and being made well before
  # the payment line can be read.  Payment is still parsed and recorded, it just
  # no longer gates anything.  Set true to require PAID (the original RULE 1).
  require_paid: true

  # Rolling window of observations kept per ticket slot.
  window_size: 15
  # A ticket ID is confirmed once the same value wins the vote this many times.
  id_confirm_observations: 3
  # Payment must read PAID on this many separate confirmed observations before
  # the ticket is created.  Guards against a single green-text misread.
  paid_confirm_observations: 3
  # Ticket content (shortcuts/quantities/add-ons) must agree this many times
  # before it is frozen onto the created order group.
  content_confirm_observations: 2
  # A slot must be absent for this long before TICKET_DISAPPEARED fires.  This
  # is what keeps identity through a temporary OCR failure.
  disappear_grace_s: 3.0
  # A card seen but unreadable still counts as "present" for the grace timer.
  unreadable_counts_as_present: true

# ---------------------------------------------------------------------------
# Dual-video synchronisation
# ---------------------------------------------------------------------------
sync:
  # Seconds to add to KDS event timestamps before comparing them with
  # production-video timestamps.  Positive = KDS stream started later.
  kds_offset_s: 0.0
  # Both streams stamp events off a single shared monotonic clock; this is a
  # correction for a known capture start difference, not a resampling.
  clock: monotonic
